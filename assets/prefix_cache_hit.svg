<line x1="40" y1="58" x2="940" y2="58" stroke="#26333a"/>
<text x="40" y="86" fill="#95a7ac" font-size="14.5">1 − Σ nISL / Σ ISL: the share of input tokens already in cache (cISL), free to skip.</text>
<text x="40" y="106" fill="#95a7ac" font-size="14.5">Append-only ReAct/CodeAct agents cluster at 93–97% — nearly all input is reused prefix.</text>
<text x="40" y="126" fill="#95a7ac" font-size="14.5">Moatless (a state machine that rebuilds its prompt per phase) collapses to ~36%; the verifier is one call.</text>
